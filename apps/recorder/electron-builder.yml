appId: com.autochar.recorder
productName: Autochar Recorder
electronVersion: 31.7.7
directories:
  output: ../../release/user
files:
  - dist/**
  - package.json
asar: true
npmRebuild: false
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Autochar-Recorder-Setup.exe
portable:
  artifactName: Autochar-Recorder-Portable.exe
extraResources:
  - from: ../../ms-playwright
    to: ms-playwright
    filter:
      - '**/*'
  - from: ../recorder-extension
    to: recorder-extension
    filter:
      - '**/*'
