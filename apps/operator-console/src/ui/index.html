<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autochar Operator Console</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Autochar Operator Console</h1>
          <p>导入、校验、生成脚本并执行已复核数据</p>
        </div>
        <button id="importButton">导入 flow package</button>
      </header>

      <section class="notice">
        遇到验证码、短信验证、风控、登录失效时需要人工处理。正式执行前必须先完成 dry-run 并确认高风险动作。
      </section>

      <section class="layout">
        <div class="left">
          <section class="panel">
            <h2>基础校验</h2>
            <div id="validationState">未导入</div>
            <ul id="validationIssues"></ul>
            <div id="riskSummary"></div>
          </section>

          <section class="panel">
            <h2>步骤</h2>
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>类型</th>
                  <th>标签</th>
                  <th>Selector</th>
                  <th>敏感</th>
                  <th>高风险</th>
                </tr>
              </thead>
              <tbody id="stepsBody"></tbody>
            </table>
          </section>
        </div>

        <aside class="right">
          <section class="panel">
            <h2>步骤截图</h2>
            <img id="screenshot" alt="步骤截图预览">
          </section>

          <section class="panel">
            <h2>执行</h2>
            <button id="generateButton" disabled>生成 Playwright 脚本</button>
            <div class="path" id="scriptPath">未生成</div>
            <button id="selectInputButton" disabled>选择 CSV/XLSX</button>
            <div class="path" id="inputPath">未选择</div>
            <label class="inline"><input id="dryRunToggle" type="checkbox" checked> dry-run</label>
            <label>max rows <input id="maxRows" type="number" min="1" value="3"></label>
            <label>start row <input id="startRow" type="number" min="1" value="1"></label>
            <label class="inline"><input id="failFast" type="checkbox"> fail-fast</label>
            <label class="inline danger"><input id="formalConfirm" type="checkbox"> 我已确认目标后台、数据文件和高风险动作</label>
            <div class="actions">
              <button id="dryRunButton" disabled>运行 dry-run</button>
              <button id="runButton" disabled>正式执行</button>
            </div>
          </section>
        </aside>
      </section>

      <section class="panel">
        <h2>结果</h2>
        <table>
          <thead>
            <tr>
              <th>row</th>
              <th>status</th>
              <th>message</th>
              <th>screenshot</th>
              <th>durationMs</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </section>

      <pre id="log"></pre>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
