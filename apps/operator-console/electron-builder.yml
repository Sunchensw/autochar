appId: com.autochar.operator
productName: Autochar Operator Console
electronVersion: 31.7.7
directories:
  output: ../../release/owner
files:
  - dist/**
  - src/ui/**
  - package.json
asar: true
npmRebuild: false
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Autochar-Operator-Console-Setup.exe
portable:
  artifactName: Autochar-Operator-Console-Portable.exe
extraResources:
  - from: ../../ms-playwright
    to: ms-playwright
    filter:
      - '**/*'
